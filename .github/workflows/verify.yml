name: Verify Treino
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- cloud.js vendor/supabase.js
      - run: node_modules/.bin/playwright-cli install-browser chrome --with-deps
      - run: node_modules/.bin/playwright-cli install-browser webkit --with-deps
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          TREINO_TEST_BROWSER: webkit
      - run: npm run test:sync-browser
      - run: npm run package:site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treino-public-site
          path: dist/
          retention-days: 7
